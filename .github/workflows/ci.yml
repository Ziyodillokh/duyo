name: CI

# Sifat tekshiruvlari: har bir pull request'da hammasi, main'ga push'da esa
# mobil o'zgarishlar tekshiriladi (backend/admin'ni main'da deploy workflow'lari
# o'z testlari bilan qoplaydi — deploy-backend.yml / deploy-admin.yml).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "duyo-mobile/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duyo-backend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: duyo-backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (no coverage gate, same as deploy smoke)
        env:
          APP_SECRET_KEY: ci_dummy_secret_at_least_16_chars
        run: pytest tests/ -v --no-cov

  backend-lint:
    name: Backend — ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duyo-backend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests

  admin:
    name: Admin — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duyo-admin
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: duyo-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  mobile:
    name: Mobile — TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duyo-mobile
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: duyo-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (project has no test runner)
        run: npx tsc --noEmit
