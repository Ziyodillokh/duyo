name: Deploy landing

# duyo.uz — the DUYO site (duyo-web: Vite + React + three.js). Built here,
# then rsynced to /opt/duyo/landing, the folder duyo.uz's nginx container
# serves read-only (duyo-docs/runbooks/landing-nginx.md). The legal pages
# Play links to — /privacy.html, /terms.html, /account-deletion.html — live
# in duyo-web/public and ship at exactly those URLs.
#
# Rollback: every deploy first copies the live folder to
# /opt/duyo/landing.prev-<timestamp> (the last three are kept). To go back:
#   rsync -a --delete /opt/duyo/landing.prev-<timestamp>/ /opt/duyo/landing/
on:
  push:
    branches: [main]
    paths:
      - "duyo-web/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build duyo-web + deploy to duyo.uz
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: duyo-web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: duyo-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (typecheck + bundle)
        run: npm run build

      # The legal pages and the crawler files must be in the bundle: Play's
      # listing points at the first three, and a deploy without them would
      # take them offline.
      - name: Check the bundle
        run: |
          set -e
          for f in index.html privacy.html terms.html account-deletion.html robots.txt sitemap.xml favicon.ico og.jpg legal/legal.css legal/legal.js; do
            test -s "dist/$f" || { echo "  ✗ dist/$f missing"; exit 1; }
          done
          grep -q '<article lang="uz"' dist/privacy.html
          grep -q '<div id="root">' dist/index.html
          echo "  ✓ bundle complete"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Back up the live site
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            mkdir -p /opt/duyo/landing
            stamp=$(date -u +%Y%m%d%H%M%S)
            cp -a /opt/duyo/landing /opt/duyo/landing.prev-$stamp
            ls -1d /opt/duyo/landing.prev-* | sort | head -n -3 | xargs -r rm -rf
            echo "backup: /opt/duyo/landing.prev-$stamp"
          '

      # Assets first, pages last: while the copy runs, a visitor never gets a
      # new index.html that points at a bundle not yet uploaded. The second
      # pass removes whatever the old site left behind.
      - name: Rsync dist → /opt/duyo/landing
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/duyo/landing/"
          rsync -az --no-perms --exclude='*.html' -e "$SSH" dist/ "$TARGET"
          rsync -az --no-perms --delete -e "$SSH" dist/ "$TARGET"

      - name: Smoke test duyo.uz (with retry)
        run: |
          check() { # url, expected substring
            for i in 1 2 3 4 5 6; do
              body=$(curl -sS --max-time 15 "$1" || true)
              if printf '%s' "$body" | grep -q "$2"; then echo "  ✓ $1"; return 0; fi
              echo "  … $1 not ready (attempt $i), retrying in 5s"; sleep 5
            done
            echo "  ✗ $1 does not contain: $2"; return 1
          }
          check https://duyo.uz/ '<div id="root">'
          check https://duyo.uz/privacy.html 'data-legal-lang="uz"'
          check https://duyo.uz/terms.html 'data-legal-lang="uz"'
          check https://duyo.uz/account-deletion.html 'data-legal-lang="uz"'
          check https://duyo.uz/robots.txt 'Sitemap: https://duyo.uz/sitemap.xml'
          test "$(curl -sS -o /dev/null -w '%{content_type}' https://duyo.uz/og.jpg)" = "image/jpeg"
          echo "  ✓ duyo.uz is serving the new site"
