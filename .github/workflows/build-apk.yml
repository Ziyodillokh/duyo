name: Build Android release

# Ikki artefakt bitta manbadan quriladi:
#   APK — to'g'ridan-to'g'ri yuklab olish uchun, serverga chiqariladi:
#     https://admin.duyo.uz/apk/duyo.apk        — APK fayl
#     https://admin.duyo.uz/apk/version.json    — oxirgi versiya ma'lumoti
#   AAB — Google Play faqat shu formatni qabul qiladi (artefakt sifatida
#     yuklab olinadi, Play Console'ga qo'lda yuklanadi).
#
# versionCode endi app.json'da (`expo.android.versionCode`) — bitta manba.
# Play bir marta yuklangan raqamdan kichik yoki teng raqamni BOSHQA hech qachon
# qabul qilmaydi, shuning uchun uni CI raqamidan emas, commit'dan olamiz:
# har relizda app.json'da qo'lda oshiriladi va diff'da ko'rinadi.
#
# Talab: ANDROID_UPLOAD_* (imzo kaliti) + DEPLOY_* (server) secrets.
on:
  # CI yashil bo'lgandan keyingina quriladi — sinovdan o'tmagan kod na
  # admin.duyo.uz'ga, na Play'ga chiqmaydi.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  # Queue, don't kill. An APK takes ~20 min; with cancel-in-progress a run of
  # quick successive pushes cancelled every build in turn and no APK was ever
  # published. Queued runs execute in order, so the newest still publishes last.
  cancel-in-progress: false

jobs:
  apk:
    name: Gradle release APK + publish
    # workflow_run har qanday yakunda ishga tushadi — muvaffaqiyatsiz CI'ni
    # bu yerda to'xtatamiz.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duyo-mobile
    env:
      # EXPO_PUBLIC_* qiymatlar build paytida JS ichiga muhrlanadi
      EXPO_PUBLIC_API_BASE_URL: https://api.duyo.uz/v1
      EXPO_PUBLIC_WS_BASE_URL: wss://api.duyo.uz/v1/chat/voice
      CI: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run standart holda default branch'ning uchini oladi;
          # CI tekshirgan aynan o'sha commit kerak. Qo'lda ishga tushirilganda
          # bu qiymat bo'sh bo'ladi — checkout o'z odatiy tanloviga qaytadi.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: duyo-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Har build android/ ni noldan yaratadi, lekin Gradle YUKLAB OLADIGAN
      # narsalar (AGP, Kotlin, barcha Maven artefaktlari, RN va Hermes'ning
      # oldindan qurilgan .aar fayllari) o'zgarmaydi — ular faqat bog'liqliklar
      # to'plamiga bog'liq. Shuning uchun kesh kaliti package-lock.json'ga
      # bog'lanadi: bog'liqliklar o'zgarmasa, kesh to'liq mos keladi.
      # Bu har build'dagi bir necha yuz MB yuklab olishni olib tashlaydi.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('duyo-mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      # Kalit android/ ichiga EMAS, $RUNNER_TEMP'ga yoziladi: android/ artefakt
      # sifatida yuklanishi yoki keyingi prebuild'da tozalanishi mumkin.
      - name: Install upload keystore
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "ANDROID_UPLOAD_KEYSTORE_BASE64 secret o'rnatilmagan" >&2
            exit 1
          fi
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}

      # Sozlamalar `findProperty` orqali o'qiladi, shuning uchun buyruq
      # qatoridan beriladi. android/ ni tahrirlash mumkin emas — uni har build'da
      # `expo prebuild` qaytadan yaratadi.
      #
      # -PreactNativeArchitectures — Expo shabloni standart holda to'rtta ABI
      #   quradi (armeabi-v7a,arm64-v8a,x86,x86_64). x86 va x86_64 faqat
      #   emulyator uchun; birorta ham haqiqiy telefon ularni ishlatmaydi, lekin
      #   125 MB APK'ning 49.7 MB'ini (40%) egallardi.
      #
      # -Pexpo.useLegacyPackaging — standart `false` .so fayllarni APK ichida
      #   SIQILMAGAN holda saqlaydi. Play Store uchun bu to'g'ri (Play o'zi
      #   siqib yetkazadi), lekin bu APK admin.duyo.uz'dan to'g'ridan-to'g'ri
      #   yuklanadi — siqilmagan baytlar to'g'ridan-to'g'ri tarmoqdan o'tadi.
      #   O'lchandi: 39.6 MB -> 14.9 MB (62% kam). Evaziga o'rnatish biroz
      #   sekinroq (kutubxonalar ochib olinadi); ishga tushish tezligi o'zgarmaydi.
      #
      # Ikkala bayroq ham FAQAT shu APK uchun to'g'ri — AAB job'ida yo'q.
      #
      # Parollar `env:` orqali uzatiladi: `run:` tanasidagi secret buyruq
      # jurnalida ochiq ko'rinib qolishi mumkin.
      - name: Build release APK (arm only, siqilgan kutubxonalar)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --build-cache \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pexpo.useLegacyPackaging=true \
            -PDUYO_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.keystore" \
            -PDUYO_UPLOAD_STORE_PASSWORD="$UPLOAD_STORE_PASSWORD" \
            -PDUYO_UPLOAD_KEY_ALIAS="$UPLOAD_KEY_ALIAS" \
            -PDUYO_UPLOAD_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Report APK size
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "APK: $(du -h "$APK" | cut -f1)"
          unzip -v "$APK" | awk '$1 ~ /^[0-9]+$/ && NF>=8 {
            split($8,p,"/"); k=(p[1]=="lib")?p[1]"/"p[2]:p[1]; c[k]+=$3
          } END { for (x in c) printf "%8.1f MB  %s\n", c[x]/1048576, x }' | sort -rn | head -12

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duyo-apk
          path: duyo-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Tartib muhim: avval APK, keyin version.json — foydalanuvchi hech qachon
      # hali chiqmagan APK haqida xabar olmaydi.
      #
      # versionCode app.json'dan o'qiladi — ilova ichidagi UpdatePrompt aynan
      # shu raqamni o'zining `nativeBuildVersion`i bilan solishtiradi, ya'ni
      # manifest va APK ichidagi raqam bir xil manbadan kelishi shart.
      - name: Publish APK + version.json to server
        run: |
          VERSION=$(jq -r '.expo.version' app.json)
          VERSION_CODE=$(jq -r '.expo.android.versionCode' app.json)
          NOTES=$(git log -1 --pretty=%s)
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg version "$VERSION" \
            --arg url "https://admin.duyo.uz/apk/duyo.apk" \
            --arg notes "$NOTES" \
            '{android: {versionCode: $versionCode, version: $version, url: $url, notes: $notes}}' \
            > version.json
          cat version.json
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'mkdir -p /opt/duyo/admin/apk'
          rsync -avz --no-perms -e "$SSH" \
            android/app/build/outputs/apk/release/app-release.apk \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/duyo/admin/apk/duyo.apk
          rsync -avz --no-perms -e "$SSH" \
            version.json \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/duyo/admin/apk/version.json

      - name: Smoke test (version.json served)
        run: |
          sleep 2
          curl -fsS --max-time 10 https://admin.duyo.uz/apk/version.json

  aab:
    name: Gradle release AAB (Play)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duyo-mobile
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.duyo.uz/v1
      EXPO_PUBLIC_WS_BASE_URL: wss://api.duyo.uz/v1/chat/voice
      # Bu bayroq bo'lmasa Play build'i ham o'zini APK yuklab yangilashga
      # urinadi, va Play'ning Device and Network Abuse siyosati buni
      # to'g'ridan-to'g'ri taqiqlaydi. `IS_PLAY_BUILD` (src/lib/distribution.ts)
      # shu qiymatni o'qiydi; qiymat bundle paytida JS ichiga muhrlanadi, ya'ni
      # yangilash kodi Play artefaktidan butunlay chiqib ketadi.
      #
      # APK job'ida ATAYLAB yo'q: admin.duyo.uz'dan o'rnatganlar uchun
      # yangilanishni yetkazadigan yagona yo'l — o'sha kod.
      EXPO_PUBLIC_DISTRIBUTION: play
      CI: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: duyo-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('duyo-mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Install upload keystore
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "ANDROID_UPLOAD_KEYSTORE_BASE64 secret o'rnatilmagan" >&2
            exit 1
          fi
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}

      # APK job'idagi ikkala bayroq bu yerda ATAYLAB yo'q:
      #   -PreactNativeArchitectures — bundle'da ABI'lar alohida split bo'lib
      #     ketadi va telefon faqat o'ziga keraklisini yuklab oladi, ya'ni
      #     hajm yutug'i yo'q. Ammo x86_64'ni olib tashlash Play'ning o'z
      #     pre-launch test qurilmalarini ham abadiy chetlab o'tadi.
      #   -Pexpo.useLegacyPackaging — extractNativeLibs=true qiladi; Play
      #     Console buni ogohlantirish sifatida belgilaydi va bundle ichida
      #     hech qanday foyda bermaydi (Play siqishni o'zi boshqaradi).
      - name: Build release AAB (barcha ABI, siqilmagan kutubxonalar)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon --build-cache \
            -PDUYO_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.keystore" \
            -PDUYO_UPLOAD_STORE_PASSWORD="$UPLOAD_STORE_PASSWORD" \
            -PDUYO_UPLOAD_KEY_ALIAS="$UPLOAD_KEY_ALIAS" \
            -PDUYO_UPLOAD_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      # Imzosiz AAB ham muvaffaqiyatli quriladi — Play esa uni rad etadi.
      # Shuning uchun imzo shu yerda tekshiriladi, Play Console'da emas.
      - name: Verify the AAB is signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          echo "AAB: $(du -h "$AAB" | cut -f1)  versionCode: $(jq -r '.expo.android.versionCode' app.json)"
          unzip -l "$AAB" | grep -qE "META-INF/.*\.(RSA|EC|DSA)" || {
            echo "AAB imzolanmagan — imzo kaliti secrets'lari tekshirilsin" >&2
            exit 1
          }

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: duyo-aab
          path: duyo-mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
