name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "duyo-backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:  # manual trigger button

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false  # let in-flight deploy finish before next one

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duyo-backend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: duyo-backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (skip coverage gate for CI smoke)
        env:
          APP_SECRET_KEY: ci_dummy_secret_at_least_16_chars
        run: pytest tests/ -v --no-cov

  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: duyo-backend
    steps:
      - uses: actions/checkout@v6

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync api source → server
        run: |
          rsync -avz --delete --no-perms \
            --exclude='.venv' --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='.pytest_cache' --exclude='.mypy_cache' --exclude='.ruff_cache' \
            --exclude='tts_samples/' --exclude='*_validation.json' \
            --exclude='.env' --exclude='.env.local' \
            --exclude='*.egg-info' --exclude='dist' --exclude='build' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            src migrations pyproject.toml README.md alembic.ini Dockerfile .dockerignore \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/duyo/api/

      # NOTE: production runs the api/nginx/postgres/redis stack imperatively
      # (docker run on the duyo_internal network), NOT via docker-compose.
      # duyo-backend/docker-compose.yml is a LOCAL-DEV file (no api/nginx/networks)
      # and must never be rsynced over the server — doing so previously detached
      # postgres onto the compose default network and broke DB name resolution.
      - name: Build image, migrate, recreate api (imperative, postgres untouched)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "GIT_SHA='${{ github.sha }}' bash -se" <<'REMOTE'
              set -euo pipefail
              SHA="${GIT_SHA:0:12}"
              cd /opt/duyo/api

              # 0. Disk, before anything. A build that dies with "no space left
              #    on device" fails at exactly the same place as a broken
              #    Dockerfile, and the two are indistinguishable in the log
              #    unless the free space is printed. Nothing here pruned images
              #    until step 6 was added, so a box that has taken dozens of
              #    deploys is the first thing to suspect.
              echo "--- disk before build ---"
              df -h /var/lib/docker /opt/duyo 2>/dev/null || df -h /
              docker system df || true

              # 1. Build image — UNMASKED so a failed build fails the deploy.
              #    (Old `... 2>&1 | tail` swallowed build errors via the pipe exit code.)
              echo "--- docker build duyo-api:$SHA ---"
              docker build -t "duyo-api:$SHA" -t duyo-api:latest .

              # 2. Ensure postgres reachable on the api network. NEVER recreate it
              #    (stateful, data in volume). Just connect with the service alias
              #    'postgres' if missing — idempotent.
              if ! docker inspect duyo-postgres \
                   -f '{{range $n,$c := .NetworkSettings.Networks}}{{$n}} {{end}}' \
                   | grep -qw duyo_internal; then
                echo "--- connecting postgres to duyo_internal (alias postgres) ---"
                docker network connect --alias postgres duyo_internal duyo-postgres
              else
                echo "--- postgres already on duyo_internal ---"
              fi

              # 3. Alembic migrations (idempotent). Unmasked.
              echo "--- alembic upgrade head ---"
              docker run --rm \
                --network duyo_internal \
                --env-file /opt/duyo/.env \
                -e DATABASE_URL="postgresql+asyncpg://duyo:$(cat /opt/duyo/secrets/db_password.txt)@postgres:5432/duyo" \
                "duyo-api:$SHA" alembic upgrade head

              # 4. Recreate the api container with the NEW image.
              #    Env is dumped from the currently-running container (the proven,
              #    authoritative set — /opt/duyo/.env does NOT carry the full app env
              #    such as DATABASE_URL/REDIS_URL/ESKIZ_*). nginx upstream points at
              #    host 'api', so the new container MUST keep --network-alias api.
              echo "--- recreate api container ---"
              if docker inspect duyo-api >/dev/null 2>&1; then
                docker inspect duyo-api --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  | grep -vE '^(PATH|LANG|GPG_KEY|PYTHON_VERSION|PYTHON_SHA256|PYTHONDONTWRITEBYTECODE|PYTHONUNBUFFERED|PIP_)=' \
                  > /tmp/duyo-api-deploy.env || true
                docker stop duyo-api >/dev/null 2>&1 || true
                docker rename duyo-api "duyo-api-prev-$SHA"
              else
                echo "  no existing duyo-api; falling back to /opt/duyo/.env"
                cp /opt/duyo/.env /tmp/duyo-api-deploy.env
              fi

              # Second env-file adds infra vars (MinIO/object storage, public base
              # URL) without overriding the dumped core env — additive only.
              docker run -d --name duyo-api --restart unless-stopped \
                --network duyo_internal --network-alias api \
                --env-file /tmp/duyo-api-deploy.env \
                --env-file /opt/duyo/api-extra.env \
                duyo-api:latest
              rm -f /tmp/duyo-api-deploy.env

              # 5. Health-gate the new container; roll back to the previous one on failure.
              ok=0
              for i in $(seq 1 12); do
                if docker exec duyo-api curl -fsS http://localhost:8000/v1/health >/dev/null 2>&1; then
                  ok=1; break
                fi
                echo "  api not healthy yet ($i/12)..."; sleep 3
              done
              if [ "$ok" != "1" ]; then
                echo "!!! new api failed health — rolling back"
                docker logs duyo-api 2>&1 | tail -30 || true
                docker stop duyo-api >/dev/null 2>&1 || true
                docker rm duyo-api >/dev/null 2>&1 || true
                if docker inspect "duyo-api-prev-$SHA" >/dev/null 2>&1; then
                  docker rename "duyo-api-prev-$SHA" duyo-api
                  docker start duyo-api
                fi
                exit 1
              fi

              # 6. Success — drop the previous container.
              docker rm "duyo-api-prev-$SHA" >/dev/null 2>&1 || true
              echo "--- deploy ok: $(docker ps --filter name=duyo-api --format '{{.Status}} | {{.Image}}') ---"

              # 7. Reclaim disk. Every deploy leaves behind a duyo-api:<sha>
              #    image and the layers under it, and nothing removed them —
              #    on a small VPS that ends as a build failing for want of
              #    space, which looks exactly like a code problem.
              #
              #    Runs only after the health gate passed, and keeps the two
              #    images that matter: :latest and this SHA. `|| true` on all
              #    of it — housekeeping must never fail a deploy that worked.
              echo "--- prune old images ---"
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep "^duyo-api:" \
                | grep -v -e ":latest$" -e ":$SHA$" \
                | xargs -r docker rmi 2>/dev/null || true
              docker image prune -f || true
              echo "--- disk after ---"
              df -h /var/lib/docker 2>/dev/null || df -h /
          REMOTE

      - name: Smoke test (HTTPS health endpoints, with retry)
        run: |
          set -e
          # Wait for api healthcheck + nginx upstream warm-up.
          # First attempt at t=15s; retry every 5s up to 60s total.
          probe() {
            local url=$1 label=$2
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fsS --max-time 10 "$url"; then
                echo "  ✓ $label ready (attempt $i)"
                return 0
              fi
              echo "  … $label attempt $i failed, retrying in 5s"
              sleep 5
            done
            echo "  ✗ $label still failing after 40s"
            return 1
          }
          sleep 15
          echo "--- liveness ---"
          probe https://api.duyo.uz/v1/health liveness
          echo
          echo "--- db readiness ---"
          probe https://api.duyo.uz/v1/health/db db
          echo
          echo "--- redis readiness ---"
          probe https://api.duyo.uz/v1/health/redis redis
          echo
