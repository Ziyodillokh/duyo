name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "duyo-backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:  # manual trigger button

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false  # let in-flight deploy finish before next one

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duyo-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: duyo-backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (skip coverage gate for CI smoke)
        env:
          APP_SECRET_KEY: ci_dummy_secret_at_least_16_chars
        run: pytest tests/ -v --no-cov

  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: duyo-backend
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync source → server
        run: |
          rsync -avz --delete --no-perms \
            --exclude='.venv' --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='.pytest_cache' --exclude='.mypy_cache' --exclude='.ruff_cache' \
            --exclude='tts_samples/' --exclude='*_validation.json' \
            --exclude='.env' --exclude='.env.local' \
            --exclude='*.egg-info' --exclude='dist' --exclude='build' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            src migrations pyproject.toml README.md alembic.ini Dockerfile .dockerignore \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/duyo/api/

      - name: Build image + run migration + recreate api
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            bash -se <<'REMOTE'
              set -e
              cd /opt/duyo/api
              echo "--- docker build ---"
              docker build -t duyo-api:latest . 2>&1 | tail -10
              echo "--- alembic upgrade head (idempotent) ---"
              docker run --rm \
                --network duyo_internal \
                --env-file /opt/duyo/.env \
                -e DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER:-duyo}:$(cat /opt/duyo/secrets/db_password.txt)@postgres:5432/${POSTGRES_DB:-duyo}" \
                duyo-api:latest alembic upgrade head 2>&1 | tail -5
              echo "--- recreate api container ---"
              cd /opt/duyo
              docker compose up -d --force-recreate api 2>&1 | tail -3
          REMOTE

      - name: Smoke test (HTTPS health endpoints)
        run: |
          set -e
          sleep 10  # api needs ~8s for healthcheck to flip
          echo "--- liveness ---"
          curl -fsS https://api.duyo.uz/v1/health
          echo
          echo "--- db readiness ---"
          curl -fsS https://api.duyo.uz/v1/health/db
          echo
          echo "--- redis readiness ---"
          curl -fsS https://api.duyo.uz/v1/health/redis
          echo
