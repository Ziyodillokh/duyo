services:
  postgres:
    image: postgres:16-alpine
    container_name: duyo-postgres
    environment:
      POSTGRES_USER: duyo
      POSTGRES_PASSWORD: duyo_dev_password
      POSTGRES_DB: duyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duyo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: duyo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: duyo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: duyo
      MINIO_ROOT_PASSWORD: duyo_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
