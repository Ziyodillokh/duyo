[project]
name = "duyo-backend"
version = "0.1.0"
description = "DUYO — AI Companion for Children. Backend services."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "XRR" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.27",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "google-genai>=2.6.0",
    "pgvector>=0.3.0",
    "phonenumbers>=8.13.0",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# Install for local textbook ingestion only — NOT in production Docker image.
# Usage: brew install tesseract tesseract-lang && pip install -e ".[ingestion]"
# Tesseract handles scanned PDFs, Uzbek Cyrillic, broken-encoding PDFs.
# Stable on Apple Silicon (PaddlePaddle's detection model fails on macOS ARM).
# pymupdf renders PDF pages to images; Pillow passes them to Tesseract.
ingestion = [
    "docling>=2.0.0",
    "pytesseract>=0.3.10",
    "pymupdf>=1.23.0",
    "Pillow>=10.0.0",
    # MinerU: VLM+OCR pipeline for math/physics — extracts formulas as LaTeX.
    # Heavy (16GB+ RAM, ~2GB models); Apple Silicon MPS supported.
    "mineru[core]>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "anthropic>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duyo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ARG", "RUF"]
# UP042 wants `enum.StrEnum` instead of `(str, Enum)`. Deliberately kept:
# StrEnum changes `str(Member)` from "Class.MEMBER" to the value, which would
# silently alter AI prompts, SMS text, and stored enum strings across the app.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/Body/File/Header are factory calls used as parameter
# defaults — the documented idiom. They are immutable for B008's purposes.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
# The textbook module embeds Uzbek/Russian Cyrillic and Latin characters in
# regex patterns and test data on purpose — RUF001 ambiguous-char warnings
# are false positives there.
"src/duyo/textbook/*" = ["RUF001"]
"tests/textbook/*" = ["RUF001"]
# BOARD_PROMPT deliberately uses the typographic maths signs (× ÷ − √ ²) that
# should appear on the chalkboard; ASCII "x" and "-" would look wrong there.
"src/duyo/prompts.py" = ["RUF001"]
# Same reason: the puzzle explanations are read by a child on the chalkboard,
# so they use × and ² rather than ASCII stand-ins.
"src/duyo/services/puzzles.py" = ["RUF001"]
# Crisis detection matches Uzbek Cyrillic/Latin and Russian keywords verbatim;
# "fixing" the ambiguous characters would break detection of real messages.
# RUF002/RUF003 too: the comments and docstrings there NAME the apostrophe
# variants (ʻ U+02BB, ʼ U+02BC) the normaliser folds — spelling them out is the
# whole point of the explanation.
"src/duyo/crisis/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_crisis_detector.py" = ["RUF001", "RUF002", "RUF003"]
# Sample Russian-language lesson vocabulary — genuine Cyrillic content, not a
# typo risk.
"scripts/seed_language_content.py" = ["RUF001"]
# Test-suite idioms, not defects: patched stubs must keep the signature of the
# function they replace (ARG001), pytest.raises(Exception) guards code paths
# that intentionally raise bare exceptions (B017), and nested `with patch(...)`
# blocks stay readable one-per-line (SIM117).
"tests/*" = ["ARG001", "B017", "SIM117", "RUF015"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/duyo --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
