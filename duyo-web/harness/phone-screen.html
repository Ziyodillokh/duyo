<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phone screen harness</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; background: #8d9096; font-family: system-ui, sans-serif; color: #1b1d21; }
      #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px 18px; padding: 20px 24px; }
      #grid.single { display: block; padding: 0; }
      #grid.single canvas { width: 720px; border-radius: 0; box-shadow: none; }
      #grid.scrub { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      #grid.scrub input { width: min(720px, 90vw); }
      #grid.scrub output { font: 600 13px/1 ui-monospace, Menlo, monospace; }
      #grid.scrub figure { width: 360px; }
      #grid.bench { display: block; }
      pre { font: 500 15px/1.6 ui-monospace, Menlo, monospace; background: #f4f5f7; padding: 24px; border-radius: 12px; }
      figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      /* The phone display's corner radius at this scale (≈92 of 720 px). */
      figure canvas { width: 100%; height: auto; border-radius: 12.8% / 6%; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      figcaption { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module" src="./phone-screen.ts"></script>
  </body>
</html>
