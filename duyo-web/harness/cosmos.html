<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cosmos harness</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #03050c; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .copy { position: fixed; top: 50%; transform: translateY(-50%); width: 36%; color: #f4f7fd;
        font: 16px/1.55 system-ui, sans-serif; pointer-events: none; }
      .copy h2 { font-size: clamp(28px, 3.4vw, 52px); line-height: 1.08; margin: 0 0 18px; font-weight: 700; }
      .copy p { margin: 0 0 12px; color: #c9d4e8; }
      .copy.left { left: 6%; }
      .copy.right { right: 6%; }
      @media (max-width: 767px) { .copy, .copy.left, .copy.right { left: 6%; right: 6%; width: auto; top: 62%; } }
      .hud { position: fixed; left: 8px; bottom: 8px; color: #9fd0ff; font: 12px/1.4 ui-monospace, monospace;
        white-space: pre; pointer-events: none; opacity: 0.8; }
    </style>
  </head>
  <body>
    <script type="module" src="./cosmos.ts"></script>
  </body>
</html>
